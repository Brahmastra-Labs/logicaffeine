[package]
name = "logicaffeine-proof"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Kernel-checked proof search and tactics, certified SAT/CDCL with DRAT/LRAT output, and a number-theory and cryptanalysis library"
readme = "README.md"
include = ["src/**", "/README.md", "/CHANGELOG.md", "/LICENSE.md"]

[features]
default = []
verification = ["dep:logicaffeine-verify"]

[dependencies]
logicaffeine-base = { workspace = true }
logicaffeine-kernel = { workspace = true }
logicaffeine-verify = { workspace = true, optional = true }
# CRITICAL: NO LANGUAGE DEPENDENCY - Liskov Invariant

# Solver-vs-Z3 benchmark generator (emits benchmarks/results/solvers.json). Z3-gated.
[[example]]
name = "solver_bench"
required-features = ["verification"]
