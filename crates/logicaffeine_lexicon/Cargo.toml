[package]
name = "logicaffeine-lexicon"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
license = "MIT"
description = "The English vocabulary behind LOGOS: verb, noun and adjective metadata for build-time lookup tables, plus an optional runtime JSON index"
readme = "README.md"
include = ["src/**", "assets/**", "/README.md", "/CHANGELOG.md", "/LICENSE.md"]

[dependencies]
# For dynamic-lexicon feature (runtime JSON loading)
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
rand = { version = "0.8", optional = true }

[features]
default = []
dynamic-lexicon = ["serde", "serde_json", "rand"]

# The README (rendered as the crate docs via include_str!) shows a `runtime`
# example that needs `dynamic-lexicon`. Depending on ourselves with the feature
# on makes that doctest compile and run; a path-only dev-dep is stripped on
# publish and never reaches the shipped dependency graph.
[dev-dependencies]
logicaffeine-lexicon = { path = ".", features = ["dynamic-lexicon"] }

[package.metadata.docs.rs]
features = ["dynamic-lexicon"]
