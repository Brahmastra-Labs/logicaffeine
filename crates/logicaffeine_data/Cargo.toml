[package]
name = "logicaffeine-data"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
license = "MIT"
description = "LOGOS runtime values, collections, wire format and CRDTs, shared by native and WASM builds"
readme = "README.md"
include = ["src/**", "/README.md", "/CHANGELOG.md", "/LICENSE.md"]

[features]
# The C ABI over the compiled value model (`abi`): what a C program the exact extension reaches links,
# as a static library, so the C backends compute with these values instead of a copy of them.
c-abi = []

[dependencies]
logicaffeine-base = { workspace = true }
# indexmap is pure + wasm-safe (insertion-ordered maps — the LOGOS Map contract).
# DIRECT version, not `workspace = true`: staged builds (hotswap wasm bundles, AOT
# cdylibs, e2e temp projects) copy this crate OUTSIDE the workspace, where
# workspace-inherited third-party deps cannot resolve. Same convention as
# rustc-hash/serde below.
indexmap = { version = "2", features = ["serde"] }
rustc-hash = "2"
serde = { version = "1.0", features = ["derive"] }
# No IO dependencies (Lamport invariant): no tokio, no libp2p. The one clock read
# is native generate_replica_id's; no merge reads SystemTime.

# getrandom is WASM-compatible for random replica ID generation
# js feature enables Web Crypto API on wasm32-unknown-unknown
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
bincode = "1.3"

[package.metadata.docs.rs]
features = ["c-abi"]
