[package]
name = "logicaffeine-system"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Platform IO, networking, HTTP serving, persistence, and post-quantum crypto (Keccak/SHA-3, ChaCha20-Poly1305, ML-KEM, ML-DSA) for LOGOS"
readme = "README.md"
include = ["src/**", "/README.md", "/CHANGELOG.md", "/LICENSE.md"]

[features]
default = []  # LEAN by default - no network, no persistence, no parallelism

# Individual capabilities (opt-in)
# The thin WebSocket relay — a light capability (tokio-tungstenite over the
# tokio/futures already present), NO libp2p. The interpreter enables this for
# live networking without dragging the mesh stack in. `networking` (libp2p)
# implies it so a native node can bridge the relay into the mesh.
relay = ["dep:tokio-tungstenite", "dep:futures"]
# Native HTTP/1.1 server for the `Serve` statement — hand-rolled wire core over
# the tokio already present, NO hyper. Native only; purely additive (off by
# default). Pulls tokio's `net` feature (TcpListener/TcpStream) on demand.
http = ["tokio/net"]
networking = ["dep:libp2p", "dep:futures", "relay"]
persistence = ["dep:memmap2", "dep:sha2"]
concurrency = ["dep:rayon", "dep:bumpalo"]
io-uring = ["dep:io-uring", "dep:crossbeam-channel", "persistence"]

# Convenience bundles. `full` is FULL: every native capability that is not platform-specific
# (`io-uring` is Linux-only and stays opt-in). The stdlib prelude's `http.lg` binds
# `logicaffeine_system::http`, so any generated project staged with `full` must see it —
# a `full` without `http` made `largo check --deep` fail with "cannot find `http`"
# (locked by crates/logicaffeine_tests/tests/system_full_feature_lock.rs).
full = ["networking", "persistence", "concurrency", "http"]
distributed = ["networking", "persistence"]  # For Distributed<T>

[dependencies]
# Always included (lightweight core)
logicaffeine-base = { workspace = true }
logicaffeine-data = { workspace = true }
# insertion-ordered Set impls (direct version: staged builds have no workspace root)
indexmap = "2"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
async-trait = "0.1"
once_cell = "1.19"
async-lock = "3.4"
crc32fast = "1.3"
# TLS for the native socket natives. ★ NOT OPTIONAL, DELIBERATELY: a networking stack that
# silently cannot speak TLS is the "looks supported" trap — `pgConnect` reaches no managed
# Postgres and no LOGOS program can call an HTTPS API. Both crates were already in this
# workspace's lock (via reqwest/ureq/tokio-rustls), so this adds no new supply-chain surface.
# `webpki-roots` rather than the OS store so a compiled binary trusts the same roots wherever it
# runs — the same reason everything else here is pinned.
# `default-features = false` + `ring` so exactly ONE crypto provider is reachable: with both
# `ring` and `aws-lc-rs` compiled in, rustls refuses to pick and panics at the first handshake
# ("Could not automatically determine the process-level CryptoProvider"). Matches the provider
# `tokio-rustls` is pinned to below, so both tiers use one implementation.

# Feature-gated heavy dependencies
libp2p = { version = "0.54", optional = true, features = [
    "tcp", "quic", "noise", "yamux", "mdns",
    "request-response", "gossipsub", "macros", "tokio"
] }
# Thin WebSocket relay (browser↔mesh bridge): a plain WS server, no extra libp2p
# surface. Native only; the browser side speaks the same wire protocol over
# `gloo-net`/`web-sys` WebSocket.
tokio-tungstenite = { version = "0.24", optional = true }
memmap2 = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
rayon = { version = "1.10", optional = true }
bumpalo = { version = "3.19", optional = true }
futures = { version = "0.3", optional = true }

# Native-only (always available on native, not WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# ★ TLS IS NATIVE-ONLY, AND THIS WAS NOT A TIDYING MOVE. These three sat in the all-targets
# `[dependencies]` table while their only consumer, `tcp`, is `cfg(not(wasm32))` — so a
# wasm32-unknown-unknown build linked rustls's `ring` backend, which has no entropy source on that
# target and cfg's out the `SecureRandom` impls rustls requires. The result was 16 errors INSIDE
# rustls (`SystemRandom: SecureRandom` unsatisfied, `UnixTime::now` missing) on a build of a scalar
# `add` function, failing `hotswap_p17_wasm::scalar_function_builds_to_a_wasm_module` 3/3.
#
# Seeding the generated project with the workspace lockfile was NOT the fix — it pinned rustls to
# the workspace's own 0.23.40 and the same 16 errors appeared, which is what proved the problem was
# the TARGET and not version drift.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0"
# The interpreter/VM tier drives sockets through tokio, so it needs the async wrapper over the
# SAME rustls config the synchronous AOT path uses — one set of roots, one verification policy,
# two runtimes. Anything else is a tier divergence in the security-relevant direction.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "signal"] }
rand = "0.8"
getrandom = "0.2"
uuid = { version = "1.0", features = ["v4"] }

# Unix: the stack a compiled program's `Main` runs on (`stack`). `psm` switches `Main` onto a stack mapped for it on
# the thread that started it (the stack switch rustc's `stacker` is built on), so the process stays single-threaded;
# `libc` maps that stack and its guard pages and reports a run past its end. `libc` also makes the socket calls std
# does not expose (SO_REUSEPORT on the io_uring engine's per-shard listeners).
[target.'cfg(unix)'.dependencies]
psm = "0.1"
libc = "0.2"

# Linux-only: io_uring for kernel-async file I/O and the thread-per-core HTTP
# engine.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { version = "0.7", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

# WASM dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Sync-only tokio: `mpsc` (the cross-target `Pipe` channel) is runtime-agnostic and compiles
# on wasm. The runtime-tied parts (spawn/yield/timer) are provided per-target instead.
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
# `random.rs` uses `rand::thread_rng()` on every target; on wasm it reseeds from
# getrandom's `js` backend (enabled above).
rand = "0.8"
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "StorageManager",
    "FileSystemDirectoryHandle", "FileSystemFileHandle",
    "FileSystemWritableFileStream", "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions", "FileSystemCreateWritableOptions",
    "File", "Blob", "DomException",
    "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent",
    # WebSocket for the thin relay client
    "WebSocket", "BinaryType", "CloseEvent",
    # IndexedDB features for fallback VFS
    "IdbFactory", "IdbDatabase", "IdbObjectStore", "IdbRequest", "IdbTransaction",
    "IdbTransactionMode", "IdbOpenDbRequest", "IdbVersionChangeEvent",
    "IdbObjectStoreParameters", "Event", "EventTarget", "DomStringList"
]}

[dev-dependencies]
# A self-signed cert for the in-process TLS server the socket tests stand up.
rcgen = "0.11"
tempfile = "3.10"
# The http_lifecycle_lock drives blocking handlers via `futures::executor::block_on`
# from inside the async server (a handler that parks synchronously until released).
futures = "0.3"
# Dev-only ML-KEM oracle (RustCrypto, FIPS 203). NEVER in the shipped graph — the Logos-native
# crypto, composed from this crate's verified primitives, is validated bit-exact *against* it.
ml-kem = { version = "0.2", features = ["deterministic"] }
# Dev-only ML-DSA oracle (RustCrypto, FIPS 204), same role: validate our composition bit-exact.
ml-dsa = "0.0.4"
# Dev-only ChaCha20-Poly1305 reference (RustCrypto, RFC 8439) — the AEAD speed baseline.
chacha20poly1305 = "0.10"
# Dev-only HTTP/1.1 parse oracle: the hand-rolled wire core's accept/reject verdicts
# are differentially validated against it. NEVER in the shipped graph.
httparse = "1"

# Headless-browser tests for the relay client (run via `wasm-pack test --headless`).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
futures = "0.3"

[package.metadata.docs.rs]
# Document with all features for comprehensive API coverage
features = ["full"]
