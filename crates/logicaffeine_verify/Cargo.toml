[package]
name = "logicaffeine-verify"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Z3-based static verification and model checking for Logicaffeine"
readme = "README.md"
include = ["src/**", "/README.md", "/CHANGELOG.md", "/LICENSE.md"]

[features]
# Build Z3 from vendored source and link it statically — the release-binary
# flavor (`largo-full`). z3 0.20 renamed this feature `vendored` (builds the
# z3-src crate via cmake; the vendored Z3 4.16 compiles cleanly under libc++,
# which the old 4.12 did not on macOS). Default stays dynamic against system Z3.
static-link-z3 = ["z3/vendored"]

[dependencies]
# SMT solver
z3 = "0.20"

# Serialization for certificates and the verification IR
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
