[package]
name = "logicaffeine-base"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
license = "MIT"
description = "Foundation types for Logicaffeine: arenas, string interning, spans, and exact integers, decimals, quantities, money, dates and UUIDs"
readme = "README.md"
include = ["src/**", "/README.md", "/CHANGELOG.md", "/LICENSE.md"]

[dev-dependencies]
# Oracles for differential testing — our own MD5/SHA-1/UUID are validated bit-exact against the
# reference crates (and benchmarked against them to prove we are faster). Test/bench only.
md-5 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v3", "v4", "v5", "v7"] }
