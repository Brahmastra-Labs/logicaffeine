name = "logicaffeine-heal"
main = "src/index.js"
compatibility_date = "2026-09-30"
workers_dev = false
preview_urls = false

# A route of its own on api.logicaffeine.com, so Cloudflare sends /heal here.
[[routes]]
pattern = "api.logicaffeine.com/heal"
zone_name = "logicaffeine.com"

[vars]
ALLOWED_ORIGINS = "https://logicaffeine.com,https://www.logicaffeine.com,https://logicaffeine.pages.dev,https://*.logicaffeine.pages.dev"
# NVIDIA's OpenAI-compatible chat endpoint, and the model the worker asks for. Nemotron 3.5 Bolt
# (2026-11-02): no reasoning pass, a whole heal in about 3 s, and it mended the sample right. GLM
# 5.3 Flash never answered; MiniMax M3.1 Flash reasons first and takes 15 to 85 s. Most of the
# catalogue is not enabled for the account; `GET /v1/models` lists ids and a 404 says which are.
UPSTREAM_URL = "https://integrate.api.nvidia.com/v1/chat/completions"
MODEL = "nvidia/nemotron-3.5-bolt-e4b"
# How long the worker waits for the model (it reasons before it answers), and the most text one
# heal takes.
UPSTREAM_TIMEOUT_MS = "60000"
MAX_TEXT_BYTES = "8192"

# GO-LIVE: `npx wrangler secret put NVIDIA_API_KEY` (an NVIDIA API key for the free endpoints). The
# value never goes in the repository, a file or chat.
[secrets]
required = ["NVIDIA_API_KEY"]

# GO-LIVE: rate limit namespace ids are unique per account; confirm 1303 is free.
[[ratelimits]]
name = "HEAL_IP_LIMIT"
namespace_id = "1303"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
