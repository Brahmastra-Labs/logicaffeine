# The shape of a clean checkout. `crates/logicaffeine_tests/tests/repo_shape_lock.rs` enforces it over
# every file a checkout holds: tracked files present on disk plus untracked files no ignore rule covers.
# `work/` is the private workspace and is not checked.
#
# Each rule's [pending] list names today's known offenders. A rule is clean when its list is empty.
# The lock fails on an offender missing from the list and on a row that no longer offends, so the
# lists only shrink: fix the file, then delete its row.

[root]
# The only entries the repository root may hold.
allowed = [
  ".config",
  ".github",
  ".githooks",
  ".gitignore",
  "apps",
  "benchmarks",
  "crates",
  "docs",
  "editors",
  "examples",
  "scripts",
  "services",
  "AGENTS.md",
  "CHANGELOG.md",
  "CLAUDE.md",
  "Cargo.lock",
  "Cargo.toml",
  "LICENSE.md",
  "LOGOS_QUICKGUIDE.md",
  "README.md",
]

[never_tracked]
# A path component equal to one of these, a file ending in one of the suffixes, or a file with one of
# the names never belongs in a checkout.
components = [
  "__pycache__",
  "node_modules",
  "target",
  ".DS_Store",
]
suffixes = [
  ".pyc",
  ".pyo",
  ".pid",
  ".probe",
  ".bak",
  ".orig",
  ".rej",
  ".swp",
]
names = [
  ".z3-trace",
  ".env",
]

[empty]
allowed_names = [
  ".gitkeep",
  # The conformance contract's recorded stderr of a verified Lean import: a verified run writes no
  # diagnostics, and its FIXTURES.json pins that empty recording's digest.
  "verified.diagnostics.ndjson",
]

[size]
max_bytes = 5242880
# Deliberately checked-in files above the budget, each with its reason.
allowed = []

[names]
example_forbidden_prefixes = [
  "zz_",
  "scratch_",
  "_tmp",
]
example_header = ["//!"]
test_forbidden_prefixes = [
  "zz_",
  "scratch_",
  "_tmp",
  "debug_",
]

[scripts]
# Entry points: what people run. Everything else in scripts/ lives in a category folder.
top_level = [
  "run-all-tests-fast.sh",
  "run-all-tests.sh",
  "run-research-tests.sh",
  "run-silicon-tests.sh",
  "run-kernel-pending-tests.sh",
  "run-opt-audit-tests.sh",
  "run-qemu-corpus-tests.sh",
  "run-arena-mathlib-tests.sh",
  "run-model-bars-tests.sh",
  "run-opt-in-feature-tests.sh",
  "run-handed-reds-tests.sh",
  "compare-test-runs.sh",
  "test-count.sh",
  "bump-version.sh",
  "generate-docs.sh",
  "generate-roadmap.sh",
  "check-packaging.sh",
  "check-binary-sizes.sh",
  "run-ci-locally.py",
  # the tt ledger's reproducers: tenstorrent_gemm.json records them at this path
  "tt-sim.sh",
  "tt-matmul-measure.sh",
  "tt-gemm-ledger.py",
  # runs the decode images of benchmarks/silicon/decode_images.json on the boards and records what each measured
  "decode-host.py",
  # runs the decode step split over both boards (benchmarks/silicon/decode_split_images.json) and records each chip
  "split-host.py",
  # the Fabric Terminal: the REPL on Board B's screen and keyboard, its program library and the fabric engine's view
  "logos-terminal.py",
]
# The folders of scripts/: the categories, the shared shell library, a workspace member, trees whose paths are
# recorded (plasticine, qor, xc7) or mirror a vendored layout (openlane-overlay), the pinned tools' patched builds
# (opensta, openroad), and the patches to a vendored tool (openxc7-patches).
folders = ["test", "bench", "accel", "hw", "lean", "wasm", "web", "release", "dev", "lib", "wiki_trace", "plasticine", "qor", "xc7", "d5005", "openlane-overlay", "opensta", "openroad", "openxc7-patches"]

[stdlib]
# Every standard-library module is LOGOS source.
dir = ["crates/logicaffeine_compile/assets/std"]
extension = ["lg"]

[local_only]
# Trees that live beside the product on one machine and never in a checkout. Each may be a real
# directory or a symlink into shared storage, so each must be ignored as a plain path.
names = [
  "external",
  "logs",
  "models",
  "reference-kernels",
  "tools",
  "work",
]

[home_paths]
# Account names that belong to no one: a CI runner's home, a documentation placeholder.
generic_users = [
  "runner",
  "user",
]

