# ★ A LOAD-SENSITIVE SERVER TEST IS NOT A FLAKY ONE. `bind_address_lock` SPAWNS a real `largo run`
# and dials the answer over the machine's LAN address — the assertion a deployed binary actually
# depends on, since a loopback-only bind is unreachable from any container. Under the full baseline
# it shares a box with ~22,600 other tests, and an interpreted server losing its race to a 180-second
# boot budget reports `got: None`, which reads exactly like a binding regression and is none.
#
# MEASURED, not assumed: it fails in-suite and passes ISOLATED in 42.5s against that same budget.
# So the fix is to stop it competing, not to widen the clock — the budget is already generous and
# raising it would only delay the same false red.
#
# ★ AND IT IS DELIBERATELY NOT `#[ignore]`d. That was the tempting move: the test is "flaky", so
# park it. But a flaky test is not a weaker passing test, it is a result nobody can read — and a
# sibling lock in this tree hid a REAL defect for however long behind exactly that classification
# (two tests raced on one relative store path; once isolation made the red honest, a second bug was
# sitting underneath it in plain sight). Serialising keeps the assertion running on every baseline,
# which is the point: this is the lock that caught a binary answering only on loopback.
[test-groups.bind-address]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(bind_address_lock)'
test-group = 'bind-address'

[[profile.full.overrides]]
filter = 'binary(bind_address_lock)'
test-group = 'bind-address'

# The post-synthesis gate-level silicon locks run a REAL `synth_xilinx` yosys flow and then
# gate-level simulate a ~90-RAMB/tens-of-thousands-of-LUT netlist under iverilog. Their own
# `#[ignore]` reasons declare the cost — "~20-30min" for the seven PHASE-1 localization probes
# and "~30-60min" for the four gold-standard result sims — and the file's header says plainly:
# "Run it single-threaded so the heavy sims never overlap." Nothing enforced that, so all eleven
# ran CONCURRENTLY, each starved the others of CPU, and every one hit the `full` profile's 30-min
# backstop: 11 identical `TIMEOUT [1800.0xx s]` rows, which read as eleven code regressions and
# were none. This group enforces the contract the file already stated. The budget (600s × 43)
# is derived: the largest test's worst case, 25162 s, is its gate sims' cycle budgets at the slowest
# core measured (14 cycles/s) plus 600 s of synthesis and compile per sim, and each test re-checks
# the budget before synthesizing (wpe_postsynth_silicon_lock::postsynth_wall_cap_s). A REAL hang
# still fails loud — it is a backstop, not a licence. These are also excluded from the routine baseline by
# run-all-tests-fast.sh (see HEAVY_ONDEMAND_EXCLUDE) and run on purpose via
# scripts/run-silicon-tests.sh; the file's FAST construction locks — which enforce the exact
# invariant each silicon fix establishes, in milliseconds, with no yosys — keep running every push.
[test-groups.wpe-postsynth]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(wpe_postsynth_silicon_lock) & test(/^postsynth_/)'
test-group = 'wpe-postsynth'
slow-timeout = { period = "600s", terminate-after = 43 }

[[profile.full.overrides]]
filter = 'binary(wpe_postsynth_silicon_lock) & test(/^postsynth_/)'
test-group = 'wpe-postsynth'
slow-timeout = { period = "600s", terminate-after = 43 }

# The S1 decode board's gate-level sims (fabric_postsynth_lock): the same class — a real synth_xilinx, then a netlist
# stepped on its serial line, about an hour — in the same group, so no two gate-level sims ever run at once, and under
