# AOT-native tier tests (HOTSWAP §Axis-3) each shell out to `rustc`/`cargo` to build a
# cdylib / wasm module / binary, recompiling the shared runtime crates in a PRIVATE temp
# target. Running several at once (they're all `#[ignore]`'d and only run under
# `--run-ignored`) storms the box — CPU plus ext4 dir-htree pressure from millions of
# `.dwo` files — and a build can transiently FAIL under that contention, panicking on
# `.expect("cdylib builds")`. The code is correct (each passes in isolation), so serialize
# the group (max-threads = 1) and retry a transient build failure, instead of letting the
# full suite flake on a self-inflicted build storm.
[test-groups.aot-cdylib]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(/^(aot_native_tier|aot_native_corpus|hotswap_p14_slice|hotswap_p15_aot_load|hotswap_p16_bundle|hotswap_p16_cache|hotswap_p17_wasm|hotswap_p18_bg_aot)$/)'
test-group = 'aot-cdylib'
retries = 2

[[profile.full.overrides]]
filter = 'binary(/^(aot_native_tier|aot_native_corpus|hotswap_p14_slice|hotswap_p15_aot_load|hotswap_p16_bundle|hotswap_p16_cache|hotswap_p17_wasm|hotswap_p18_bg_aot)$/)'
test-group = 'aot-cdylib'
retries = 2

# `largo check --deep` regression tests share ONE temp workbench (`$TMP/logos_check_deep_regression`)
# and serialize its `cargo check`s with a process-local mutex — which nextest's process-per-test
# scheduler cannot see, so two tests would race: one process `remove_dir_all`s the workbench while
# another's cargo check is still inside it ("cannot determine the current directory" /
# "No such file or directory" at workbench init). One cargo check at a time is the test's own
# stated contract; the group enforces it across processes. No retries: a failure here is real.
[test-groups.check-deep]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(logicaffeine-tests) & binary(check_deep_regression)'
test-group = 'check-deep'

[[profile.full.overrides]]
filter = 'package(logicaffeine-tests) & binary(check_deep_regression)'
test-group = 'check-deep'

# The mutation-safety lock drives a LOGOS HTTP handler against ONE hermetic file store at a fixed
# path (`/tmp/logos_mutation_safety.txt`). Its own `GUARD` mutex serializes the tests inside a
# process, but nextest runs each test in a process of its OWN, so that mutex cannot see the others:
# concurrently, one test's fresh store lands mid-way through another's sequence and both read
# versions neither wrote (a first request answering `2|10`, a stored value reverting to `0|0`). The
# store is the shared resource, so the group serializes every test that touches it — the same shape
# as `check-deep` above. No retries: a failure here is real.
[test-groups.mutation-store]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(logicaffeine-tests) & binary(mutation_safety_lock)'
test-group = 'mutation-store'

[[profile.full.overrides]]
filter = 'package(logicaffeine-tests) & binary(mutation_safety_lock)'
test-group = 'mutation-store'

# Every heavy CUDA lock shells out to `nvcc` and launches a real kernel on the SINGLE local GPU
# (this box's RTX 3060, 12 GB). nextest's default scheduler runs many at once, oversubscribing the
# one device: the 8 GB Qwen-forward lock races the big-GEMM benches for VRAM, and the timing-gated
# locks (the "…climbs" speed assertions, the tok/s and GOPS floors) degrade 2–13× under concurrent
# load and trip — a self-inflicted flake, NOT a regression (each PASSES in isolation; MEASURED: the
# real-Qwen8B forward took 347s racing the sweep vs 149s alone, mma_k32 107s vs 8s). There is only
# one GPU, so the correct schedule is one GPU test at a time, and that holds only when EVERY test that
# reaches the device is in the group: a GPU lock outside it runs beside a member and measures the
# contention, not its kernel. The group is every test binary whose source probes the device
# (`common::require_gpu()`, `common::require_tool("gpu")` or `"/dev/nvidia0"`): the whole cuda_* class
# by PREFIX, so a future cuda lock is covered by its name, and each GPU binary outside the prefix by name.
# nextest_schedule_lock derives that list from the sources and holds the filter to it exactly, in every
# profile. The chain is long, so the full run starts it first (priority 80, below the timing group's).
# NO retries: a serialized timing lock that still fails is a genuine perf regression and must fail
# loud, never be masked. Applied to every profile so no invocation — ad-hoc, CI, or the fast script
# — can oversubscribe the GPU.
[test-groups.cuda-gpu]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(logicaffeine-tests) & (binary(/^cuda_/) | binary(/^(batched_equivalence_lock|c_family_scheduler_conformance_lock|decode_gpu_lock|fused_launch_equivalence_lock|gated_delta_mechanism_lock|matmul_multibackend_lock|moe_mechanism_lock|qwen38_golden_lock|sass_control_assign_gpu_lock|sass_optimize_gemm_gpu_lock|sass_reuse_optimizer_gpu_lock|spatial_forward_lock|spatial_one_ir_lock|spatial_section_accumulator_lock|tensor_reduction_ops_lock|tensor_sugar_all_backends_lock)$/))'
test-group = 'cuda-gpu'

[[profile.ci.overrides]]
filter = 'package(logicaffeine-tests) & (binary(/^cuda_/) | binary(/^(batched_equivalence_lock|c_family_scheduler_conformance_lock|decode_gpu_lock|fused_launch_equivalence_lock|gated_delta_mechanism_lock|matmul_multibackend_lock|moe_mechanism_lock|qwen38_golden_lock|sass_control_assign_gpu_lock|sass_optimize_gemm_gpu_lock|sass_reuse_optimizer_gpu_lock|spatial_forward_lock|spatial_one_ir_lock|spatial_section_accumulator_lock|tensor_reduction_ops_lock|tensor_sugar_all_backends_lock)$/))'
test-group = 'cuda-gpu'

[[profile.full.overrides]]
filter = 'package(logicaffeine-tests) & (binary(/^cuda_/) | binary(/^(batched_equivalence_lock|c_family_scheduler_conformance_lock|decode_gpu_lock|fused_launch_equivalence_lock|gated_delta_mechanism_lock|matmul_multibackend_lock|moe_mechanism_lock|qwen38_golden_lock|sass_control_assign_gpu_lock|sass_optimize_gemm_gpu_lock|sass_reuse_optimizer_gpu_lock|spatial_forward_lock|spatial_one_ir_lock|spatial_section_accumulator_lock|tensor_reduction_ops_lock|tensor_sugar_all_backends_lock)$/))'
test-group = 'cuda-gpu'
priority = 80

# A REAL DATABASE IS A SHARED RESOURCE, exactly like the single GPU and the one ttsim tree above.
# `postgres_live` DOWNLOADS AND RUNS an actual PostgreSQL (9 tests, all `#[ignore = "live: …"]`, so they
# only appear under `--run-ignored all` — which the full baseline uses). Nothing serialized them, so they
# ran against the other ~22,000 tests and against each other.
#
# MEASURED 2026-09-13: `live_cancel_request_best_effort` FAILED in the full baseline and PASSES in 4.5s
# alone. Its assertion is that a cancel leaves the session usable; under load the cancel packet lands
# after the statement it targeted has already finished, so the error surfaces on the NEXT query —
# `["pid captured", "cancel sent", "ERROR 57014: canceling statement…", "done"]` where `"42"` was
# expected. That is the race the test's own name calls "best effort", widened by contention until it
# reported a product failure that does not exist.
#
# Serializing does NOT weaken the assertion — it stays exactly as strict. It removes the one condition
# under which a correct implementation cannot satisfy it.
[test-groups.live-db]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(postgres_live)'
test-group = 'live-db'

[[profile.ci.overrides]]
filter = 'binary(postgres_live)'
test-group = 'live-db'

[[profile.full.overrides]]
filter = 'binary(postgres_live)'
test-group = 'live-db'

# CPU TIMING LOCKS — the same self-inflicted flake the `cuda-gpu` group fixes for the GPU, one level
# down. A lock that compares two wall-clock timings degrades under concurrent load, and MEASURED tonight:
# `c_bytecode_perf_lock` reported `fib_rec` at 1.89x over a 1.30x ceiling in the full baseline and 0.90x
# in isolation (the bytecode emitter is FASTER than the AST one); `columnar_field_scan` reported 3.375x
# over a 3.0x ceiling and 1.65x in isolation. Both messages say "fix the implementation, do NOT loosen the
# ceiling" — correct instructions that would have sent someone optimising an emitter that was already
# winning. `fib_rec` runs in 2.81 ms; a timing that small is scheduler noise under load.
#
# ★ WHAT THIS GROUP DOES. `max-threads = 1` stops the timing locks racing EACH OTHER, and
# `threads-required = "num-test-threads"` stops every OTHER test of the run racing them: a member needs every test
# thread, so nextest starts it only when nothing else of the run is running and starts nothing beside it. The
# contended resource is the CPU and everything uses it, so a timing lock is measured alone or not at all. What it
# cannot stop is load from outside the run (another build on the box) — a timing failure is still re-run alone
# before it is believed. `priority = 100` starts every member ahead of the rest of the run, one after another
# while nothing else is in flight, so none of them waits mid-run for the slowest test to drain. Every other early
# start sits below it: a member waiting for every thread holds back each test queued behind it, so a heavy that
# started first (a minutes-long simulator, a fuzzer) would leave the box idle until it ended. `ssr_bench_lock`,
# the T00-021 deep-spine scaling test and the wire codec's build-in-place parity lock assert wall-clock time under
# other names and are listed by name.
#
# The filter matches SUFFIXES (`_perf_lock`, `_timing_lock`) so future timing locks are covered without
# anyone remembering to add them — deliberately NOT `binary(/perf/)`, which would catch
# `phase107_performatives` (speech acts, not performance) and serialize it for nothing.
[test-groups.cpu-timing]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(/_perf_lock$/) | binary(/_timing_lock$/) | binary(perf_gate) | binary(off_cse_timing) | binary(ssr_bench_lock) | (package(logicaffeine-compile) & test(/columnar_field_scan/)) | (package(logicaffeine-tests) & test(/structural_sharing_keeps_the_bit_blast_linear/)) | (package(logicaffeine-tests) & test(/a_deep_spine_costs_linearly_in_its_depth_and_not_quadratically$/)) | (package(logicaffeine-compile) & test(/build_in_place_encode_is_at_capnp_parity$/))'
test-group = 'cpu-timing'
threads-required = "num-test-threads"
priority = 100

[[profile.ci.overrides]]
filter = 'binary(/_perf_lock$/) | binary(/_timing_lock$/) | binary(perf_gate) | binary(off_cse_timing) | binary(ssr_bench_lock) | (package(logicaffeine-compile) & test(/columnar_field_scan/)) | (package(logicaffeine-tests) & test(/structural_sharing_keeps_the_bit_blast_linear/)) | (package(logicaffeine-tests) & test(/a_deep_spine_costs_linearly_in_its_depth_and_not_quadratically$/)) | (package(logicaffeine-compile) & test(/build_in_place_encode_is_at_capnp_parity$/))'
test-group = 'cpu-timing'
threads-required = "num-test-threads"
priority = 100

[[profile.full.overrides]]
filter = 'binary(/_perf_lock$/) | binary(/_timing_lock$/) | binary(perf_gate) | binary(off_cse_timing) | binary(ssr_bench_lock) | (package(logicaffeine-compile) & test(/columnar_field_scan/)) | (package(logicaffeine-tests) & test(/structural_sharing_keeps_the_bit_blast_linear/)) | (package(logicaffeine-tests) & test(/a_deep_spine_costs_linearly_in_its_depth_and_not_quadratically$/)) | (package(logicaffeine-compile) & test(/build_in_place_encode_is_at_capnp_parity$/))'
test-group = 'cpu-timing'
threads-required = "num-test-threads"
priority = 100

