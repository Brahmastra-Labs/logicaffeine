# generated dirs — the same shape as the `ttsim` group above, one simulator and one build tree. So they
# are serialized in every profile and the backstop is sized to a chain run (a 128³ GEMM took minutes end
# to end; a stalled PIR partitioner has been observed to make no progress for forty minutes, which is
# exactly what a terminate-after must catch loud). The filter matches the NAME SUFFIX every chain gate
# carries (`…passes_pir_in_the_container`, and `…in_spatials_simulator` for the Scala-backend runs of an app
# too large for PIR — same container, same sbt tree) so the next lane's gate is covered without anyone
# remembering to add it. Each gate is honestly tool-gated (`docker` + `plasticine-toolchain` through require_tool):
# an absent chain is a counted `LOGOS_TOOL_SKIP:`, never a silent pass.
[test-groups.plasticine-chain]
