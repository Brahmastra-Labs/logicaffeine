# `largo serve` builds and runs a REAL AOT backend: the dev server compiles the project's Rust
# backend into a temp target dir, spawns it, and — for the watch tests — kills and REBUILDS it on
# every source edit. Each of these tests therefore carries one or more full Rust compiles inside
# its own wall-clock budget.
#
# MEASURED, on this box: `edits_to_pages_backend_and_static_hot_reload` takes 12.9s alone and
# FAILED at 38s under the crate's 448-test parallel run — starved of CPU by its own suite, then
# reported as "generation never ticked", which reads as a broken hot reload and is not one. The
# same shape as the `aot-cdylib` group above: the code is correct, the schedule was not.
#
# Serializing them costs the crate almost nothing (they are a handful of tests that mostly WAIT on
# a compiler) and removes the only way this class can flake. NO retries: a serialized dev-server
# test that still fails is a real regression and must fail loud. Applied to every profile, so no
# invocation — ad hoc, CI, or the fast script — can starve them.
# `bitblast_budget_lock::structural_sharing_keeps_the_bit_blast_linear` joined for the same reason,
# measured the same way: it asserts a 5-block bit-blast finishes in under 5s (the bound exists because an
# UNSHARED blaster cannot finish three blocks at all). It takes ~6.2s for the whole binary in isolation and
# took 10.057s inside the 23,100-test baseline. Its DAG/tree node counts — the assertion that actually
# proves the sharing — are deterministic and were correct in that same failing run; only the wall clock
# degraded. Serializing the ONE timing test keeps the measurement honest without weakening the bound.
# `bind_address_lock` joined them for the same reason and was measured the same way:
# 26s alone, TIMED OUT at 30s inside a 579-test parallel run. It starts a real `largo
# serve` and waits for it to bind, so what it measures under contention is the machine.
[test-groups.dev-server]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(logicaffeine-tests) & binary(/^(serve|serve_watch|serve_fullstack|serve_fullstack_watch|bind_address_lock)$/)'
test-group = 'dev-server'

[[profile.ci.overrides]]
filter = 'package(logicaffeine-tests) & binary(/^(serve|serve_watch|serve_fullstack|serve_fullstack_watch|bind_address_lock)$/)'
test-group = 'dev-server'

[[profile.full.overrides]]
filter = 'package(logicaffeine-tests) & binary(/^(serve|serve_watch|serve_fullstack|serve_fullstack_watch|bind_address_lock)$/)'
test-group = 'dev-server'

