# The full profile runs every test through a wrapper script (`[scripts.wrapper.test-ledger]` below), which nextest
# takes only with the experiment on.
experimental = ["wrapper-scripts"]

[profile.default]
retries = 0
# Warn every 60s, then TERMINATE at 20 min (60s × 20). No single test may hang an
# interactive/iteration run — a runaway (e.g. a non-ignored research probe) is killed
# and reported, never left spinning. Non-ignored tests should finish in seconds, so this
# only ever fires on an accidental hang or an unbounded research test run ad hoc.
slow-timeout = { period = "60s", terminate-after = 20 }
fail-fast = false

[profile.ci]
retries = 1
fail-fast = true

# Mutation-testing profile (driven by
# scripts/test/run-mutation-core.sh via `cargo mutants --test-tool nextest`). A tight timeout
# so an infinite-loop mutant (a flipped loop condition) is killed in ~2 min instead of
# hitting the 30-min full-suite backstop, and fail-fast so a mutant that a test catches
# stops the run immediately. Baseline correctness-core tests finish in seconds, so this
# only ever fires on a genuinely-hanging mutant.
[profile.mutants]
retries = 0
fail-fast = true
slow-timeout = { period = "30s", terminate-after = 4 }

# Full-baseline profile: every test, no retries, no early exit. Used by
# scripts/run-all-tests-fast.sh for parity with the cargo-test baseline run.
[profile.full]
retries = 0
# Warn at 120s, then TERMINATE at 30 min (120s × 15) — a HARD backstop so no single
# test can hang the baseline for hours. The legit heavies (aot_montgomery ~875s,
# jit_mega_fuzz, futamura) finish well under this; the multi-hour SAT/coNP research
# probes are excluded up front by run-all-tests-fast.sh, and this catches any straggler
# that isn't. A terminated test is a FAILURE, so a genuine new hang is never silent.
slow-timeout = { period = "120s", terminate-after = 15 }
fail-fast = false
final-status-level = "slow"

# Every test of a full run goes through scripts/test/test-ledger.sh, which appends what it cost (wall clock, CPU with
# every process it waited for, peak memory, how it ended) to the run's ledger when `LOGOS_TEST_LEDGER` names one, as
# run-all-tests-fast.sh does for its first pass, and otherwise only runs it. A gate's load is read from the ledger test
# by test (scripts/test/test-ledger-report.py): nextest counts each test as one thread, and the tests that fan out
# inside are what crowd the box. test_ledger_lock holds the wrapper transparent and the wiring here.
[scripts.wrapper.test-ledger]
command = { command-line = "scripts/test/test-ledger.sh", relative-to = "workspace-root" }

[[profile.full.scripts]]
filter = 'all()'
run-wrapper = 'test-ledger'

# The research campaign: scripts/run-research-tests.sh, and work/research through
# `--config-file <repo>/.config/nextest.toml --profile research`. Its probes run for minutes to hours,
# so `full`'s 30-min terminate would fail a sound probe. The 6 h cap (600s × 36) is a runaway guard
# only, not a measured bound: no run of the campaign has been timed yet.
[profile.research]
retries = 0
slow-timeout = { period = "600s", terminate-after = 36 }
fail-fast = false
final-status-level = "slow"

# The kernel-pending specs: scripts/run-kernel-pending-tests.sh. The baseline's timeouts, plus the JUnit report
# its verdict reads (scripts/test/kernel-pending-verdict.py): each spec must fail with exactly its gap.
[profile.kernel-pending]
retries = 0
slow-timeout = { period = "120s", terminate-after = 15 }
fail-fast = false
final-status-level = "slow"

[profile.kernel-pending.junit]
path = "junit.xml"
store-failure-output = true

# The RED/GREEN profile behind scripts/test/tdd.sh. Every selected test runs (no fail-fast), and
# nothing is retried — a retry could turn a genuine RED into a flaky GREEN. The JUnit report
# is the structured record tdd.sh reads its verdict from, so the verdict never depends on
# scraping human-readable output.
[profile.tdd]
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
final-status-level = "fail"

[profile.tdd.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

# Start the wall-clock monsters right behind the timing group so they overlap the rest of the suite:
# jit_mega_fuzz (~325s, pure CPU) is the suite's floor, and the phase_futamura /
# phase_pe_differential heavies (60-220s each) otherwise queue up in the tail. Every early heavy sits at
# 90, one step below the `cpu-timing` group (see there).
[[profile.full.overrides]]
filter = 'binary(phase_futamura) | binary(phase_pe_differential) | test(jit_mega_fuzz) | test(vm_fuzz_overnight)'
priority = 90

# The Lean imports of T00-017's export. The export carries Lean's `omega` library, and `omega`'s proof of
# `n < n + k + 1` (`T00_017.letUnderBinder.proof_1`) is checked four times on import (Lean-mode inference, the
# audit's independent recheck, then registration in both kernels) over owned term trees each substitution copies.
# MEASURED 2026-10-22: 254-620 s alone (P-core or E-core), 1,382-1,800+ s under the full run, whose 30-min backstop
# terminated `original_dependent_lets_replay_all_seven_actual_bodies_and_axiom_sets` in three of five runs. They
# start with the wall-clock heavies under a 60-min backstop; the kernel's copying is its own work.
[[profile.default.overrides]]
filter = '(binary(original_dependent_terms) & test(/^original_(dependent_lets_replay_all_seven_actual_bodies_and_axiom_sets|type_let_cannot_be_replaced_by_an_opaque_lambda_parameter)$/)) | (binary(vernacular_roundtrip) & test(=fixture_t00_017_round_trips))'
slow-timeout = { period = "300s", terminate-after = 12 }

[[profile.full.overrides]]
filter = '(binary(original_dependent_terms) & test(/^original_(dependent_lets_replay_all_seven_actual_bodies_and_axiom_sets|type_let_cannot_be_replaced_by_an_opaque_lambda_parameter)$/)) | (binary(vernacular_roundtrip) & test(=fixture_t00_017_round_trips))'
slow-timeout = { period = "300s", terminate-after = 12 }
priority = 90

# The D5005 engine build under Verilator (d5005_engine_card_lock): the whole engine behind the card port and the
# shell, its core stepping in the user clock at an eighth of it, simulated as its twin (`sim/logos_engine_gated.v`, the
# core's clock gated to the user cycles it acts in), so a core cycle costs eight user cycles of the shell and some
# thirty of the four memory channels'. MEASURED 2026-10-22 on the twin at -O3, four at once beside a Quartus fit and a
# mutant batch: `the_engine_runs_a_step_with_its_memory_on_the_card` 788 s, `a_faulting_step_is_reported_by_the_engines_run`
# 262 s. A 40-minute backstop.
[[profile.default.overrides]]
filter = 'binary(d5005_engine_card_lock) & test(/^(the_engine_runs_a_step_with_its_memory_on_the_card|a_faulting_step_is_reported_by_the_engines_run)$/)'
slow-timeout = { period = "300s", terminate-after = 8 }

[[profile.full.overrides]]
filter = 'binary(d5005_engine_card_lock) & test(/^(the_engine_runs_a_step_with_its_memory_on_the_card|a_faulting_step_is_reported_by_the_engines_run)$/)'
slow-timeout = { period = "300s", terminate-after = 8 }
priority = 90

# The step program decoding the tiny model on the reference engine's AFU under Verilator, seven positions of a whole
# step each, every matvec on the engine's own array: data lines, SECDED lines, and a flip in every SECDED line.
# MEASURED 2026-10-22 on the twin at -O3 beside the same load: the data lines 1,930 s, the SECDED decodes past
# 2,000 s. A 60-minute backstop.
[[profile.default.overrides]]
filter = 'binary(d5005_engine_card_lock) & test(/^the_step_program_decodes_(on_data_lines|on_secded_lines|through_a_flip_in_every_secded_line)_as_the_machine_does$/)'
slow-timeout = { period = "300s", terminate-after = 12 }

[[profile.full.overrides]]
filter = 'binary(d5005_engine_card_lock) & test(/^the_step_program_decodes_(on_data_lines|on_secded_lines|through_a_flip_in_every_secded_line)_as_the_machine_does$/)'
slow-timeout = { period = "300s", terminate-after = 12 }
priority = 90

# Two locks whose time is another toolchain's, not ours. Qwen3.8's batched step in Spatial's own simulator: Spatial
# compiles the 316-section app (666 s), sbt compiles the 9,229 Scala sources it generates (244 s) and the run takes 48 s.
# Every emitted batched lane compiled by nvcc for sm_90a: four whole programs, one nvcc after another. MEASURED
# 2026-10-22 alone: 995 s and 347 s; in the full gate since 10-10: 1,322-1,683 s and 754-1,493 s, the simulator within
# 117 s of the 30-min backstop on 10-20. They start with the wall-clock heavies under a 60-min backstop.
[[profile.default.overrides]]
filter = '(binary(qwen38_batched_decode_lock) & test(=the_batched_step_is_the_vms_in_spatials_simulator)) | (binary(qwen38_authored_lock) & test(=every_emitted_batched_lane_compiles_for_hopper))'
slow-timeout = { period = "300s", terminate-after = 12 }

[[profile.full.overrides]]
filter = '(binary(qwen38_batched_decode_lock) & test(=the_batched_step_is_the_vms_in_spatials_simulator)) | (binary(qwen38_authored_lock) & test(=every_emitted_batched_lane_compiles_for_hopper))'
slow-timeout = { period = "300s", terminate-after = 12 }
priority = 90

# The subprocess-harness e2e tests spawn `cargo build/run` against per-slot
# sharded target dirs (/tmp/logos_e2e_cache_<NEXTEST_TEST_GROUP_SLOT>, see
# tests/common/mod.rs get_shared_target_dir). max-threads doubles as the shard
# count — keep it in sync with E2E_TARGET_SHARDS in common/mod.rs. The group cap
# guarantees each running e2e test gets a DISTINCT group slot, so no two ever
# share a target dir and contend on cargo's build lock. WITHOUT the group the
# fallback shards by `NEXTEST_TEST_GLOBAL_SLOT % 12`, which COLLIDES once the
# thread count exceeds 12 (slots 12+ alias 0+) → two builds in one dir → a
# transient build failure under load. So the override is applied to EVERY
# profile (default/ci/full), not just the full-baseline run, so no invocation —
# ad-hoc, CI, or the fast script — can flake on load.
[test-groups.e2e-subprocess]
max-threads = 12

