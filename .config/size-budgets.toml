# wasm-split off): `wasm` is the eager bundle every visitor downloads before anything is interactive, `wasm_total`
# every .wasm the build emits. Checked by scripts/web/wasm-size-gate.sh on every deploy and by
# `check-binary-sizes.sh --web`. Raised 2026-09-27 to the measured 22016282 bytes + 3% (0.10.1 shipped 12630929):
# the Studio runs the VM, the codegen backends and optimizer registry, codegen_sva and the kernel, all in the eager
# bundle until route splitting returns. On the wire that is ~6.7 MB brotli, 7.1 MB gzip (0.10.1: 3.9 MB, 4.1 MB).
# Raised 2026-10-01 (the user's approval) to the measured 23200085 bytes + 3%. Of the growth since 2026-09-27, the
# merge with the checkpoint branch and the work around it brought the tree to 23062300 bytes before the new pricing
# page; the pricing page adds 137785 bytes (measured by building the same tree with its component emptied).
