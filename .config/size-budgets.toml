# Size budgets for everything we ship, in bytes: the size measured when the budget was last set,
# plus 3% headroom. Lower a budget when a measured shrink lands; raising one is a deliberate,
# reviewed edit. Read by scripts/check-packaging.sh ([crates]) and scripts/check-binary-sizes.sh
# ([binaries], [web]); size_budget_lock keeps every published crate and shipped binary listed.
# Each entry is `key = <integer>` on its own line (the scripts read it with a flat line reader).
#
# Measured 2026-09-25, after every test left the published crates (tarballs 10.31 MB -> 8.28 MB)
# and the shipped binaries moved to [profile.dist] (largo 53.50 MB -> 37.24 MB, logicaffeine-lsp
# 25.49 MB -> 16.27 MB; x86_64 Linux).
#
# Raised 2026-09-27 (approval A24): cli, compile, language and system to their measured tarballs + 3% — the growth
# since 09-25 is product code (the LGX framework, the C-family scheduler, the full-stack web surface).
#
# Raised 2026-09-29 (KL52C-1): logicaffeine-kernel by its measured tarball growth, +18306 bytes (1265813 -> 1284119) —
# the independent kernel's own division certificate (recheck_division.rs) and its per-check conversion evidence
# (recheck_conversion_memo.rs).
# Raised 2026-09-29 (KL52I-1): logicaffeine-kernel by its measured tarball growth, +1692 bytes (1285670 -> 1287362) —
# the importer's DAG sharing (interface/lean/dag.rs +1144 compressed), the quarantine and sharing path
# (interface/lean/mod.rs +192) and the per-node payload envelope of bounded constructions (recursor_bounded.rs +265).
# Raised 2026-09-29 (KL52-5): logicaffeine-kernel by its measured tarball growth, +795 bytes (1287362 -> 1288157) —
# CHANGELOG.md, the only packaged kernel file it changed: the entries for Quot_rec as a definition, conversion without
# normalization, kept lets in deep imports and per-node construction charges.
# Raised 2026-09-29 (KL52NB-1): logicaffeine-kernel by its measured tarball growth, +3661 bytes (1288146 -> 1291807) —
# the dag checker's mode-keyed, proof-stamped refutation memo (dag/tc.rs +798 compressed) and the NbE engine's
# matching memo, argument order and step count (dag/nbe/value.rs +1172, mod.rs +586, conv.rs +502, check.rs +194,
# eval.rs +108, quote.rs +38, types.rs +7).
# Raised 2026-09-29 (KL52DV + KL52A-1): logicaffeine-kernel by its measured tarball growth, +12727 bytes
# (1291807 -> 1304534) — KL52DV's CHANGELOG lines for KL52NB (+624, measured 1292431 after it), then KL52A-1's
# Term::Annotated carrier (+12103): annotation.rs +5603 compressed (new), context.rs +1041, interface/term_parser.rs
# +977, elaborate.rs +785, term.rs +758, CHANGELOG.md +652, interface/printer.rs +372, reduction.rs +309,
# type_checker.rs +291, certificate.rs +187, term_store.rs +165, interface/surface.rs +157, recheck.rs +148,
# termination.rs +109, interface/literate_parser.rs +108, interface/lean/emit_terms.rs +99, and 19 files under +75.

