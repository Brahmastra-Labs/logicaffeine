  github-release:
    name: Create GitHub Release
    needs: [build-lsp, package-vscode, e2e-vsix, build-cli]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    permissions:
      contents: write
    steps:
      - name: Check out (for CHANGELOG.md → release notes)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir release
          cd artifacts
          # upload-artifact drops the exec bit — restore it before tarring
          # the LSP binaries (the largo tarballs were packaged in-job and
          # already carry it).
          chmod +x logicaffeine-lsp-*/logicaffeine-lsp* || true
          for dir in logicaffeine-lsp-*; do
            tar -czf "../release/${dir}.tar.gz" -C "$dir" .
          done
          cp largo-*/largo-*.tar.gz ../release/ 2>/dev/null || true
          cp largo-*/largo-*.zip    ../release/ 2>/dev/null || true
          cp vsix-*/logicaffeine-*.vsix ../release/
          cd ../release && sha256sum -- * > SHA256SUMS

      # Curated notes from the CHANGELOG — NOT GitHub's auto-generator, which
      # lists raw PR titles + authors and a "New Contributors" section (that
      # mislabeled authorship on the v0.10.0 release). The changelog is the
      # single professional source of truth for what shipped: the tag's section,
      # everything under "## [X.Y.Z]" up to the next "## [" (the version header
      # is already the release title). GitHub refuses a body over 125,000
      # characters, so a longer section keeps every heading and the text before
      # its entries, and each heading shows its first entries, whole, up to one
      # cap: the largest under which the notes fit. A heading cut short ends in a
      # pointer to the full section in the tag's CHANGELOG.md. A tag with no
      # section of its own links the changelog, so the body is never empty.
      - name: Extract release notes from CHANGELOG
        run: |
          python3 - "$RELEASE_TAG" "$GITHUB_REPOSITORY" > release-notes.md <<'NOTES'
          import re, sys

          tag, repo = sys.argv[1], sys.argv[2]
          version = tag[1:] if tag.startswith("v") else tag
          limit = 125_000
          text = open("CHANGELOG.md", encoding="utf-8").read()
          header = re.search(r"^## \[" + re.escape(version) + r"\].*$", text, re.M)
          if header is None:
              print(f"See the [changelog](https://github.com/{repo}/blob/main/CHANGELOG.md).")
              sys.exit()
          rest = text[header.end():]
          end = re.search(r"^## \[", rest, re.M)
          section = (rest[: end.start()] if end else rest).strip("\n") + "\n"
          if len(section) <= limit:
              sys.stdout.write(section)
              sys.exit()

          anchor = re.sub(r"[^\w\- ]", "", header.group(0).lstrip("#").strip().lower()).replace(" ", "-")
          url = f"https://github.com/{repo}/blob/{tag}/CHANGELOG.md#{anchor}"
          pointer = lambda omitted: f"- *…and {omitted} more, in the [full notes]({url}).*\n\n"
          head, *blocks = re.split(r"(?m)^(?=### )", section)
          headings = [(title, entries) for title, *entries in (re.split(r"(?m)^(?=- )", b) for b in blocks)]
          budget = limit - len(head) - sum(len(title) + len(pointer(len(entries))) for title, entries in headings)

          def shown(entries, cap):
              used = count = 0
              for entry in entries:
                  if used + len(entry) > cap:
                      break
                  used, count = used + len(entry), count + 1
              return count, used

          low, high = 0, max(budget, 0)
          while low < high:
              mid = (low + high + 1) // 2
              if sum(shown(entries, mid)[1] for _, entries in headings) <= budget:
                  low = mid
              else:
                  high = mid - 1
          notes = [head]
          for title, entries in headings:
              count, _ = shown(entries, low)
              notes.append(title)
              if count == len(entries):
                  notes.extend(entries)
              else:
                  kept = "".join(entries[:count]).rstrip("\n")
                  notes.append((kept + "\n" if kept else "") + pointer(len(entries) - count))
          body = "".join(notes).rstrip("\n") + "\n"
          assert len(body) <= limit, f"the {tag} notes are {len(body)} characters, over GitHub's {limit}"
          sys.stdout.write(body)
          NOTES
          echo "----- release notes -----"; cat release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # An existing draft for the tag is published, never left a draft.
          draft: false
          body_path: release-notes.md
          files: release/*

  # The honest post-publish gate: install the just-published release with
  # the real installers, pinned to this tag, and check `largo --version`.
  e2e-install:
    name: e2e install (${{ matrix.name }})
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-lean,  os: ubuntu-22.04,     args: "" }
          # linux-x64 --full on the glibc-2.35 floor: the exact combo whose
          # dynamic-libstdc++ leak shipped broken in v0.10.0 ("GLIBCXX_3.4.31
          # not found"). ubuntu-22.04 (NOT ubuntu-latest) is load-bearing —
          # it's the floor where that symbol is absent, so a regression here
          # fails to launch instead of passing on a too-new runner.
          - { name: linux-full,  os: ubuntu-22.04,     args: "--full" }
          - { name: linux-arm-full, os: ubuntu-22.04-arm, args: "--full" }
          - { name: macos-lean,  os: macos-latest,     args: "" }
          - { name: macos-full,  os: macos-latest,     args: "--full" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install via install.sh (pinned to this tag)
        run: |
          sh apps/logicaffeine_web/public/install.sh --version "${RELEASE_TAG}" ${{ matrix.args }}
          "$HOME/.local/bin/largo" --version
          VERSION_OUT="$("$HOME/.local/bin/largo" --version)"
          TAG_VERSION="${RELEASE_TAG#v}"
          case "$VERSION_OUT" in
            *"$TAG_VERSION"*) echo "version matches: $VERSION_OUT" ;;
            *) echo "installed version '$VERSION_OUT' does not match tag '$TAG_VERSION'"; exit 1 ;;
          esac

  e2e-install-windows:
    name: e2e install (windows-ps1)
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    runs-on: windows-latest
    steps:
      # A Windows runner's git checks text out as CRLF; the prelude's build script reads each module line for
      # line against its spliced code, so the tree's own LF bytes are checked out.
      - name: Keep the tree's line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install via install.ps1 (pinned to this tag)
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Get-Content -Raw apps/logicaffeine_web/public/install.ps1))) -Version $env:RELEASE_TAG
          $out = & (Join-Path $env:LOCALAPPDATA "Programs\largo\largo.exe") --version
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          if ($out -notmatch [regex]::Escape($tagVersion)) {
            throw "installed version '$out' does not match tag '$tagVersion'"
          }
          Write-Host "version matches: $out"
