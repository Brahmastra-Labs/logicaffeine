name: Publish to crates.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  Z3_SYS_Z3_HEADER: /usr/include/z3.h
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A standard runner keeps ~14 GB free; building every tarball and every docs.rs feature set needs more,
      # so the toolchains this job never uses go first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # logicaffeine-verify links the system Z3 (bindgen reads its header through libclang), and
      # every published crate is now built from its tarball before anything uploads.
      - name: Install Z3 and clang
        run: sudo apt-get update && sudo apt-get install -y z3 libz3-dev clang

      # Nothing uploads unless every published crate builds from exactly the tarball crates.io
      # will receive, every docs.rs feature set builds, and every tarball fits the upload cap.
      - name: Preflight — every published crate builds from its own tarball
        run: ./scripts/check-packaging.sh

      # A crate whose shipped code differs from its last crates.io release must say what changed: its
      # release section needs a bullet beyond the roll's "Synced to workspace version" line.
      - name: Preflight — every changed crate's CHANGELOG says what changed
        run: python3 scripts/release/check-changelogs.py

      # cargo publishes the set natively: it verifies every tarball against a local overlay of its
      # siblings, uploads in dependency order, and waits for each crate to reach the index before
      # publishing what depends on it. The set is every workspace member without a `publish` key
      # (the rule check-packaging.sh and packaging_lock share), minus crates already on crates.io at
      # their version, so a re-run after a partial publish finishes the job. An index answer other
      # than found / not found stops the job rather than guessing.
      - name: Publish the crates not yet on crates.io
        shell: bash
        run: |
          set -euo pipefail
          PENDING=()
          while IFS=$'\t' read -r name version; do
            index="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
            status=$(curl -sS -o /tmp/index-entry -w '%{http_code}' "$index")
            case "$status" in
              200)
                if grep -q "\"vers\":\"${version}\"" /tmp/index-entry; then
                  echo "${name} ${version} is already on crates.io — skipping"
                  continue
                fi
                ;;
              404) ;;
              *) echo "::error::the crates.io index answered HTTP ${status} for ${name}"; exit 1 ;;
            esac
            PENDING+=(-p "$name")
          done < <(cargo metadata --format-version 1 --no-deps | python3 -c '
          import json, sys
          for p in sorted(json.load(sys.stdin)["packages"], key=lambda p: p["name"]):
              if p["publish"] is None:
                  print(p["name"], p["version"], sep="\t")
          ')
          if [ "${#PENDING[@]}" -eq 0 ]; then
            echo "every published crate is already on crates.io at its version"
            exit 0
          fi
          echo "publishing: ${PENDING[*]}"
          cargo publish "${PENDING[@]}"
