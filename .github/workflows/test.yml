name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly (and on-demand) FULL run: everything per-PR runs PLUS the #[ignore]d
  # multi-minute fuzz/bench monsters, so nothing in the suite ever goes unrun in
  # CI. Per-PR stays fast; `schedule`/`workflow_dispatch` flip on `--run-ignored
  # all` (and `--include-ignored` for doctests) in the steps below.
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch: {}

# Architecture: archive once, run partitioned.
#
#   archive — compile every test binary ONCE (the gate's test-opt profile) and package them
#             into a single nextest archive in the runner's temp dir, never the checkout
#             (NOT the target/ dir, which blows
#             past the 10 GB cache limit). Uploaded as a short-lived artifact.
#   test    — 3 jobs download the archive and run `--partition hash:K/3` against
#             it via `--workspace-remap` (so the cargo-spawning e2e tests still
#             resolve the checked-out source at runtime). nextest splits the
#             suite into 3 disjoint shards whose union is the whole thing, so
#             every test runs exactly once across the matrix.
#   extras  — web tests + doctests (the doc harness can't be archived).
#   packaging — every published crate built from its own crates.io tarball.
#   msrv    — every published crate checked on the declared minimum Rust.
#   badge   — main only; publishes the test-count (suite-size) badge. Depends on
#             `archive` alone (which computes the count), NOT on the test/extras
#             passing — so the count never freezes behind a red suite.
#
# Why an archive, not a target/ cache: target/ is ~115 GB (84 GB of test-binary
# deps); GitHub silently drops caches over 10 GB, which would degrade a
# "build once" cache into "every job rebuilds cold". The archive is the
# compiled test binaries only, compressed to a few GB — cheap to ship.
#
# Dependency builds are cached by Swatinem/rust-cache (registry + dep artifacts,
# size-pruned — never the 115 GB of final binaries). The e2e /tmp shard caches
# are deliberately NOT persisted across runs, so a generated build can never go
# stale (each run warms them fresh; see tests/common/mod.rs).
#
# #[ignore]d tests split into two kinds:
#   - the multi-minute FUZZ/BENCH monsters (jit_mega_fuzz, vm_fuzz_overnight,
#     bench_wire_throughput, exhaustive_edge_completeness_audit, aot_native_corpus)
#     are NOT run here — they're overnight-scale; run them via
#     scripts/run-all-tests-fast.sh (no --no-ignored) on the dedicated box.
#   - the forge `mul` grounding GATES (*_heavy) are `#[ignore]`d only to keep them
#     out of the LOCAL fast loop; they're correctness gates (~280s), so the `test`
#     job runs them explicitly (partition 1, `ignored-only` + name filter).

env:
  CARGO_TERM_COLOR: always
  # The `z3` crate links the system libz3 (no bundled feature); libz3-dev puts
  # the header here. Explicit so verification never depends on a runner preinstall.
  Z3_SYS_Z3_HEADER: /usr/include/z3.h
  # Wire the mold linker (clang driver) for x86_64 Linux — matches the local
  # .cargo/config.toml, which is gitignored and so absent in CI.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -Clink-arg=-fuse-ld=mold
  # Feature set for the main suite (kept in one place so every job agrees).
  SUITE_FEATURES: logicaffeine-tests/ffi-link-tests,logicaffeine-tests/verification,logicaffeine-tests/web-tests
  ARCHIVE: nextest-archive.tar.zst

jobs:
  archive:
    runs-on: ubuntu-latest-m
    timeout-minutes: 60
    outputs:
      test_count: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Z3, mold, clang
        run: sudo apt-get update && sudo apt-get install -y z3 libz3-dev mold clang jq gcc-riscv64-linux-gnu qemu-user-static

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build nextest archive
        run: |
          set -o pipefail
          cargo nextest archive --workspace --features "$SUITE_FEATURES" \
            --profile full --cargo-profile test-opt --archive-file "$RUNNER_TEMP/$ARCHIVE"

      - name: Count tests (for badge)
        id: count
        run: |
          N=$(cargo nextest list --archive-file "$RUNNER_TEMP/$ARCHIVE" --workspace-remap "$PWD" \
                --message-format json 2>/dev/null | jq '."test-count"' 2>/dev/null || true)
          if [ -z "$N" ] || [ "$N" = "null" ]; then N=0; fi
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "Suite size: $N tests"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/${{ env.ARCHIVE }}
          retention-days: 1

      - name: Build LSP binary
        run: cargo build -p logicaffeine-lsp --release

  test:
    needs: archive
    runs-on: ubuntu-latest-m
    # 45m covers per-PR; the nightly --run-ignored all adds the multi-minute
    # monsters (split across the 3 partitions), so allow more headroom.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      # Source is required: the e2e tests spawn `cargo build` at runtime against
      # the checked-out path deps, and --workspace-remap points the archive at it.
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        # The wasm linker tests (vm::wasm::link) and forge runtime-object gates
        # spawn `rustc --target wasm32-unknown-unknown` at RUNTIME to build a wasm
        # object; without the target installed they fail with "wasm32 sysroot lib
        # dir missing". The RISC-V exact-value locks build the C value runtime with
        # `cargo build --target riscv64gc-unknown-linux-gnu` the same way. The test
        # binary itself is host-compiled in the archive job.
        with:
          targets: wasm32-unknown-unknown, riscv64gc-unknown-linux-gnu

      - name: Install Z3, mold, clang
        run: sudo apt-get update && sudo apt-get install -y z3 libz3-dev mold clang gcc-riscv64-linux-gnu qemu-user-static iverilog qemu-user yosys

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Download archive
        uses: actions/download-artifact@v4
        with:
          name: nextest-archive
          path: ${{ runner.temp }}

      - name: Run tests — partition ${{ matrix.partition }}/3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The tools this job installs, demanded: a test that needs one fails here if it is missing,
          # rather than recording a skip, so the job cannot slide back into not running them.
          LOGOS_REQUIRE_TOOLS: iverilog,qemu-riscv64,riscv64-linux-gnu-gcc,yosys
        run: |
          set -o pipefail
          # Nightly/on-demand: --run-ignored all so the fuzz/bench monsters run too.
          IGNORED=""
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) IGNORED="--run-ignored all" ;;
          esac
          # The baseline's exclusions (the research campaign, the optimization audit, the heavy on-demand locks, the kernel-pending specs, the qemu corpus, the Arena
          # mathlib cases, the real-checkpoint model bars) are read from scripts/run-all-tests-fast.sh
          # itself, never restated here, so CI excludes exactly what the local gate excludes and
          # each class keeps its one companion runner (ondemand_exclusion_lock pins both halves).
          eval "$(grep -E '^(RESEARCH|OPT_AUDIT|HEAVY_ONDEMAND|KERNEL_PENDING|QEMU_CORPUS|ARENA_MATHLIB|MODEL_BARS)_EXCLUDE=' scripts/run-all-tests-fast.sh)"
          BASELINE_FILTER="$RESEARCH_EXCLUDE and $OPT_AUDIT_EXCLUDE and $HEAVY_ONDEMAND_EXCLUDE and $KERNEL_PENDING_EXCLUDE and $QEMU_CORPUS_EXCLUDE and $ARENA_MATHLIB_EXCLUDE and $MODEL_BARS_EXCLUDE"
          cargo nextest run --archive-file "$RUNNER_TEMP/$ARCHIVE" --workspace-remap "$PWD" \
            --profile full --retries 1 $IGNORED \
            -E "$BASELINE_FILTER" \
            --partition hash:${{ matrix.partition }}/3

      # The forge `mul` grounding gate is `#[ignore]`d so the LOCAL --no-ignored
      # fast loop skips its ~280s Z3 bit-blast — but it is a correctness gate, not
      # a fuzz monster, so per-PR CI must still run it. Run it ONCE (partition 1)
      # via the archive. Skipped on the nightly/on-demand runs, where the step
      # above already covers it via `--run-ignored all`.
      - name: Run re-tiered heavy correctness gates (forge mul)
        if: matrix.partition == 1 && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          set -o pipefail
          cargo nextest run --archive-file "$RUNNER_TEMP/$ARCHIVE" --workspace-remap "$PWD" \
            --profile full --run-ignored ignored-only \
            -E 'test(witness_three_way_agreement_heavy) + test(all_specs_satisfiable_heavy)'

  extras:
    runs-on: ubuntu-latest-m
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        # The WASM-JIT differential and any runtime rustc→wasm build need the
        # wasm32 target present.
        with:
          targets: wasm32-unknown-unknown

      - name: Install Z3, mold, clang
        run: sudo apt-get update && sudo apt-get install -y z3 libz3-dev mold clang gcc-riscv64-linux-gnu qemu-user-static iverilog qemu-user

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run web tests
        run: |
          set -o pipefail
          # The web-tests feature pulls in the whole logicaffeine-web (Dioxus) crate.
          # Scope to the two web-gated test binaries so this step compiles the web
          # app + those tests ONLY — not a second full run of the entire
          # logicaffeine-tests suite (already covered by the partitions), whose slow
          # e2e cargo-build tests pushed this step past the 45-min job timeout.
          cargo nextest run -p logicaffeine-tests --features web-tests --profile full --cargo-profile test-opt --retries 1 \
            --test struggle_tests --test learn_state_tests

      # The CLI's verification feature (largo-full's substrate) must keep
      # compiling — release.yml builds it only on tags, so gate it per-PR
      # here (cheap: dynamic system Z3, check only).
      - name: Check largo verification wiring
        env:
          Z3_SYS_Z3_HEADER: /usr/include/z3.h
        run: cargo check -p logicaffeine-cli --features verification

      - name: Run doctests
        run: |
          set -o pipefail
          DOC_IGNORED=""
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) DOC_IGNORED="-- --include-ignored" ;;
          esac
          cargo test --workspace --features verification --doc $DOC_IGNORED

      # WASM-JIT codegen + differential. Built ISOLATED (scoped to
      # logicaffeine-compile + `--features wasm-jit`) because enabling wasm-jit
      # workspace-wide perturbs feature unification — so it can't ride the main
      # archive and must run as its own step, exactly like the local runner's
      # pass-1b. Without this, the wasm-jit path was never CI-tested.
      - name: Run WASM-JIT codegen + differential (isolated --features wasm-jit)
        run: |
          set -o pipefail
          IGNORED=""
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) IGNORED="--run-ignored all" ;;
          esac
          # The filterset is the ONE source of truth shared with the local runner;
          # `wasm_gated_suite_lock` derives it from the gated test sources, so a new
          # gated binary that is not listed fails the default pass instead of going dark.
          cargo nextest run -p logicaffeine-compile -p logicaffeine-tests --features wasm-jit --profile full --cargo-profile test-opt --retries 1 $IGNORED \
            --lib $(scripts/test/wasm-jit-targets.sh) \
            -E "$(cat scripts/test/wasm-jit-filter.txt)"

      # A LOGOS page in a REAL browser: the only check that is not one tier compared against
      # another. The ubuntu runners ship Chrome, and `LOGOS_REQUIRE_TOOLS=chrome` (set inside the
      # script) makes a MISSING browser a loud failure here rather than a skip — a smoke test that
      # can silently skip in CI is a smoke test that stops being run.
      - name: Browser smoke (a built LOGOS page in headless Chrome)
        run: ./scripts/web/test-web-smoke.sh

  # Every published crate builds from exactly the tarball crates.io would receive
  # (scripts/check-packaging.sh): an embed reaching outside its crate, a file its
  # `include` allowlist leaves out, a docs.rs feature set that no longer builds, or an
  # oversized tarball fails here, not on docs.rs or in `cargo install` after a release.
  packaging:
    runs-on: ubuntu-latest-m
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Z3, mold, clang
        run: sudo apt-get update && sudo apt-get install -y z3 libz3-dev mold clang

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build every published crate from its own tarball
        run: ./scripts/check-packaging.sh

  # The binaries a release ships (largo and logicaffeine-lsp, built `--profile dist` as release.yml builds them),
  # each held to its budget in .config/size-budgets.toml on every push, so the commit that grows one past its budget
  # fails the day it lands rather than at the next release.
  binary-sizes:
    runs-on: ubuntu-latest-m
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Every shipped binary within its budget
        run: ./scripts/check-binary-sizes.sh

  # The declared minimum Rust (`rust-version` in the root Cargo.toml) is built here on exactly that
  # toolchain, against the locked dependency graph, so the number a downstream user trusts is one CI
  # proves. packaging_lock pins this toolchain to the declared value.
  msrv:
    runs-on: ubuntu-latest-m
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the declared minimum Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Install Z3, mold, clang
        run: sudo apt-get update && sudo apt-get install -y z3 libz3-dev mold clang

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check every published crate on the declared minimum
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED=$(cargo metadata --format-version 1 --no-deps | python3 -c '
          import json, sys
          print(" ".join("-p " + p["name"] for p in json.load(sys.stdin)["packages"] if p["publish"] is None))
          ')
          cargo check --locked $PUBLISHED

  # The docs site exactly as deploy-docs builds it, rustdoc lints included (build.sh sets them: a dead intra-doc
  # link or a bare URL fails the build), on every push and PR; deploy-docs itself runs only after Tests pass on main.
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Z3, mold, clang
        run: sudo apt-get update && sudo apt-get install -y z3 libz3-dev mold clang

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build the docs site
        run: ./apps/logicaffeine_docs/build.sh

  # VSCode extension: lint, typecheck, packaging/version locks (vsce ls — no
  # VSCode download), then the real editor under xvfb against a debug LSP build.
  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: editors/vscode/logicaffeine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/logicaffeine/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install mold, clang
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build LSP server (debug — integration tests spawn it)
        working-directory: .
        run: cargo build -p logicaffeine-lsp

      - name: Install extension dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (packaging + version-lockstep locks)
        run: npm run test:unit

      - name: Grammar tests (quickguide ratchet + corpus snapshots)
        run: npm run test:grammar

      - name: Integration tests (VSCode under xvfb)
        run: xvfb-run -a npm run test:integration
        env:
          LOGICAFFEINE_LSP_PATH: ${{ github.workspace }}/target/debug/logicaffeine-lsp

  # The count is a SUITE-SIZE badge, not a pass/fail badge (CI status has its own
  # badge). It's computed in `archive` (compile + `nextest list`), which succeeds
  # independently of whether every test passes — so publish off `archive` alone.
  # Gating this on `test`/`extras` would freeze the count at the last all-green run
  # (which is exactly how it got stuck reporting a stale number).
  badge:
    needs: [archive]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Push badge to badges branch
        run: |
          COUNT="${{ needs.archive.outputs.test_count }}"
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${COUNT}+\",\"color\":\"brightgreen\"}" > /tmp/badge.json
          cd "$(mktemp -d)"
          git init
          git checkout -b badges
          cp /tmp/badge.json logicaffeine_test_count.json
          git add logicaffeine_test_count.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update test count badge: ${COUNT} tests"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
