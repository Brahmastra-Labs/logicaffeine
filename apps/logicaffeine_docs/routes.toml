# "Start here" routes for docs.logicaffeine.com: where each kind of work begins. They open
# /llms.txt for agents and appear on the landing page and the 404 page for people.
#
# `target` is the rustdoc file a route leads to, relative to the site root. site.py refuses the
# build when a target is not a page the site ships, and docs_site_lock.rs checks that every target
# names a curated crate and a module with source — so a route can go stale only loudly.

