<!doctype html>
<!--
  The share card: the image a link to any page of the site unfurls with, in iMessage, Slack, X and
  the rest. scripts/web/render-share-card.sh draws this page at 1200x630 into
  public/assets/OG-photo.png and records in that PNG the digest of every file drawn here, so
  tests/share_card_lock.rs knows the image is this page as it stands. Its words are the front
  page's heading, the user's line for what an agent gets, and the front page's copy button, set
  large enough to read at the width of a message bubble.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>LOGICAFFEINE share card</title>
<style>
@font-face {
  font-family: "Card Sans";
  src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.2.5/files/inter-latin-opsz-normal.woff2") format("woff2-variations");
  font-weight: 100 900;
}

:root {
  --ground: #09090b;
  --ink: #f5f5f5;
  --ink-quiet: #a1a1aa;
  --ink-soft: #d4d4d8;
  --cyan: #00d4ff;
  --cyan-glow: rgba(0, 212, 255, 0.13);
  --indigo-glow: rgba(129, 140, 248, 0.10);
}

* { margin: 0; box-sizing: border-box; }

html, body { width: 1200px; height: 630px; overflow: hidden; }

body {
  position: relative;
  background:
    radial-gradient(640px 420px at 1080px 40px, var(--cyan-glow), transparent 70%),
    radial-gradient(560px 380px at 960px 640px, var(--indigo-glow), transparent 70%),
    var(--ground);
  color: var(--ink);
  font-family: "Card Sans", sans-serif;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}

.card {
  position: absolute;
  inset: 64px 80px 64px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

.brand {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 29px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.brand img {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  filter: invert(1);
}

h1 {
  margin-top: auto;
  font-size: 64px;
  line-height: 1.04;
  letter-spacing: -0.035em;
  font-weight: 800;
}

h1 span { display: block; white-space: nowrap; }
h1 span + span { color: var(--ink-quiet); }

.lede {
  margin-top: 24px;
  max-width: 940px;
  font-size: 29px;
  line-height: 1.36;
  font-weight: 450;
  letter-spacing: -0.012em;
  color: var(--ink-soft);
  text-wrap: balance;
}

.copy {
  margin-top: 36px;
  display: inline-flex;
  align-items: center;
  gap: 14px;
  height: 64px;
  padding: 0 28px 0 24px;
  border-radius: 14px;
  background: var(--cyan);
  color: var(--ground);
  font-size: 25px;
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.copy svg { width: 28px; height: 28px; }
</style>
</head>
<body>
<main class="card">
  <p class="brand"><img src="../assets/logo.svg" alt="">LOGICAFFEINE</p>
  <h1><span>Code we can all read.</span> <span>Logic and mathematics built in.</span> <span>Bring your own agent.</span></h1>
  <p class="lede">Give your agent powerful logic, math, formal verification, and programming tools, all in one, lightweight package.</p>
  <p class="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 8.25V6a2.25 2.25 0 0 0-2.25-2.25H6A2.25 2.25 0 0 0 3.75 6v8.25A2.25 2.25 0 0 0 6 16.5h2.25m8.25-8.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-7.5A2.25 2.25 0 0 1 8.25 18v-1.5m8.25-8.25h-6a2.25 2.25 0 0 0-2.25 2.25v6"/></svg>Copy agent instructions</p>
</main>
</body>
</html>
